services:
  codingcontest-mcp:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      CCC_DATA_DIR: /data
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_CHAT_ID: ${BOT_CHAT_ID:-}
    volumes:
      - ccc-data:/data
    restart: unless-stopped

volumes:
  ccc-data:
