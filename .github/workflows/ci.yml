name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          payload="$(jq -n \
            --arg ref "$DEPLOY_REF" \
            --arg repository "$DEPLOY_REPOSITORY" \
            --arg sha "$DEPLOY_SHA" \
            --arg message "$DEPLOY_COMMIT_MESSAGE" \
            '{ref:$ref,repository:{full_name:$repository},head_commit:{id:$sha,message:$message}}')"
          response="$(curl --silent --show-error --request POST \
            --header 'X-GitHub-Event: push' \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "$DEPLOY_HOOK_URL")"
          message="$(jq -r '.message // empty' <<< "$response")"
          if [[ "$message" != 'Application deployed successfully' ]]; then
            echo "::error::Deploy hook rejected the push: ${message:-invalid response}"
            exit 1
          fi
          echo "$message"
